<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>แชร์เคสสอบสวนโรค | โรงพยาบาลท่าตูม</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f8f5;
      color: #17372d;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    .sub {
      margin-bottom: 20px;
    }

    #status {
      margin: 20px 0;
      padding: 16px;
      background: #eef8f4;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      background: #06c755;
      color: #ffffff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .small {
      margin-top: 16px;
      font-size: 13px;
      color: #70847b;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>📤 แชร์เคสสอบสวนโรค</h2>

  <div class="sub">
    ระบบสอบสวนโรค โรงพยาบาลท่าตูม
  </div>

  <div id="status">
    กำลังเชื่อมต่อ LINE...
  </div>

  <button
    id="shareButton"
    type="button"
    disabled
  >
    📤 แชร์เคส
  </button>

  <div class="small">
    เลือกเพื่อนหรือกลุ่ม LINE ที่ต้องการส่งต่อ
  </div>

</div>


<script>

/* ======================================================
   CONFIG
====================================================== */

const LIFF_ID =
  '2011675892-0Bfvc8vq';

const API_URL =
  'https://script.google.com/macros/s/AKfycbxmKEqLCVqj7BHSwSOpunVlKf6o-B9pWTctYsNhwv2-ds8_XDSCRy2FwHxzbcrIyYph/exec';


/* ======================================================
   ELEMENTS
====================================================== */

const statusBox =
  document.getElementById('status');

const shareButton =
  document.getElementById('shareButton');

let caseToken = '';

let flexMessage = null;


/* ======================================================
   STATUS
====================================================== */

function setStatus(message) {

  statusBox.textContent =
    message;

}


/* ======================================================
   TOKEN
====================================================== */

function saveCaseToken(token) {

  if (
    !/^[A-Fa-f0-9]{64}$/.test(token)
  ) {
    return;
  }

  try {

    sessionStorage.setItem(
      'THATUM_CASE_TOKEN',
      token
    );

  } catch (_) {}

}


function getCaseToken() {

  let token = '';

  /*
   * อ่าน ?k=TOKEN
   */
  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    token =
      String(
        params.get('k') || ''
      ).trim();

  } catch (_) {}


  /*
   * ถ้าเจอ token ใน URL
   */
  if (
    /^[A-Fa-f0-9]{64}$/.test(token)
  ) {

    saveCaseToken(token);

    return token;

  }


  /*
   * รองรับ liff.state
   */
  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    let state =
      String(
        params.get('liff.state') || ''
      ).trim();

    if (state) {

      try {

        state =
          decodeURIComponent(state);

      } catch (_) {}


      const questionIndex =
        state.indexOf('?');

      if (questionIndex >= 0) {

        const stateParams =
          new URLSearchParams(
            state.substring(
              questionIndex + 1
            )
          );

        token =
          String(
            stateParams.get('k') || ''
          ).trim();

        if (
          /^[A-Fa-f0-9]{64}$/.test(token)
        ) {

          saveCaseToken(token);

          return token;

        }

      }

    }

  } catch (_) {}


  /*
   * sessionStorage
   */
  try {

    token =
      String(
        sessionStorage.getItem(
          'THATUM_CASE_TOKEN'
        ) || ''
      ).trim();

  } catch (_) {

    token = '';

  }


  if (
    /^[A-Fa-f0-9]{64}$/.test(token)
  ) {

    return token;

  }


  return '';

}


/* ======================================================
   JSONP
====================================================== */

function requestFlexOnce(
  token,
  attempt
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'thatumShare_' +
        Date.now() +
        '_' +
        attempt +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      /*
       * ให้ Apps Script มีเวลามากขึ้น
       */
      const timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'TIMEOUT'
              )
            );

          },
          30000
        );


      function cleanup() {

        if (finished) {
          return;
        }

        finished = true;

        clearTimeout(timer);


        try {

          delete window[
            callbackName
          ];

        } catch (_) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(script);

        }

      }


      /*
       * Apps Script callback
       */
      window[
        callbackName
      ] =
        function(result) {

          if (finished) {
            return;
          }

          cleanup();

          resolve(result);

        };


      /*
       * โหลดไม่ได้
       */
      script.onerror =
        function() {

          if (finished) {
            return;
          }

          cleanup();

          reject(
            new Error(
              'NETWORK'
            )
          );

        };


      /*
       * Cache buster สำคัญ
       *
       * ทุกครั้งจะเป็น URL ใหม่
       */
      const cacheBuster =
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      script.src =
        API_URL +
        '?action=sharePayload' +
        '&k=' +
        encodeURIComponent(token) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&_=' +
        encodeURIComponent(
          cacheBuster
        );


      document.head
        .appendChild(script);

    }
  );

}


/* ======================================================
   โหลด FLEX
   retry อัตโนมัติ
====================================================== */

async function loadFlexMessage(
  token
) {

  let lastError = null;


  /*
   * ลองสูงสุด 3 ครั้ง
   */
  for (
    let attempt = 1;
    attempt <= 3;
    attempt++
  ) {

    try {

      setStatus(
        'กำลังเตรียมข้อมูลเคส...\n' +
        'ครั้งที่ ' +
        attempt +
        '/3'
      );


      const result =
        await requestFlexOnce(
          token,
          attempt
        );


      return result;


    } catch (error) {

      lastError =
        error;


      /*
       * ถ้ายังไม่ใช่ครั้งสุดท้าย
       * รอเล็กน้อยแล้วลองใหม่
       */
      if (attempt < 3) {

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1200
            );

          }
        );

      }

    }

  }


  throw new Error(
    lastError &&
    lastError.message === 'NETWORK'
      ? 'ไม่สามารถเชื่อมต่อระบบข้อมูลเคสได้'
      : 'หมดเวลารอข้อมูลจากระบบ'
  );

}


/* ======================================================
   INITIALIZE
====================================================== */

async function initialize() {

  try {

    setStatus(
      'กำลังเชื่อมต่อ LINE...'
    );


    /*
     * LIFF INIT
     */
    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * อ่าน Token ทันทีหลัง LIFF init
     */
    caseToken =
      getCaseToken();


    /*
     * LOGIN
     */
    if (!liff.isLoggedIn()) {

      /*
       * จำ token ก่อน redirect
       */
      if (caseToken) {

        saveCaseToken(
          caseToken
        );

      }


      setStatus(
        'กำลังเข้าสู่ระบบ LINE...'
      );


      liff.login();

      return;

    }


    /*
     * ตรวจ Share Target Picker
     */
    if (
      !liff.isApiAvailable(
        'shareTargetPicker'
      )
    ) {

      throw new Error(
        'อุปกรณ์นี้ไม่รองรับ Share Target Picker'
      );

    }


    /*
     * ถ้ายังไม่มี token
     * อ่านอีกครั้งหลัง login
     */
    if (!caseToken) {

      caseToken =
        getCaseToken();

    }


    if (!caseToken) {

      throw new Error(
        'ไม่พบรหัสเคสจากลิงก์แชร์'
      );

    }


    /*
     * โหลด Flex
     */
    const result =
      await loadFlexMessage(
        caseToken
      );


    if (
      !result ||
      result.ok !== true
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'ไม่สามารถเตรียมข้อมูลเคสได้'
      );

    }


    if (
      !result.message ||
      result.message.type !== 'flex'
    ) {

      throw new Error(
        'ข้อมูล Flex Message ไม่ถูกต้อง'
      );

    }


    flexMessage =
      result.message;


    /*
     * พร้อมใช้งาน
     */
    setStatus(
      '✅ พร้อมแชร์เคส'
    );


    shareButton.disabled =
      false;


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ ' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


    shareButton.disabled =
      true;

  }

}


/* ======================================================
   SHARE
====================================================== */

async function shareCase() {

  if (!flexMessage) {

    setStatus(
      '❌ ยังไม่มีข้อมูลเคสสำหรับแชร์'
    );

    return;

  }


  shareButton.disabled =
    true;


  setStatus(
    'กำลังเปิดรายชื่อเพื่อน / กลุ่ม...'
  );


  try {

    const result =
      await liff.shareTargetPicker(
        [
          flexMessage
        ],
        {
          isMultiple: true
        }
      );


    /*
     * สำเร็จ
     */
    if (result) {

      setStatus(
        '✅ แชร์เคสสำเร็จ'
      );

    } else {

      /*
       * ผู้ใช้ยกเลิก
       */
      setStatus(
        'ℹ️ ยกเลิกการแชร์'
      );

    }


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ ไม่สามารถแชร์เคสได้\n\n' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


  } finally {

    shareButton.disabled =
      false;

  }

}


/* ======================================================
   BUTTON
====================================================== */

shareButton.addEventListener(
  'click',
  shareCase
);


/* ======================================================
   START
====================================================== */

initialize();

</script>

</body>
</html>
