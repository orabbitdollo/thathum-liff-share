<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ทดสอบ Flex Share</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f8f5;
      color: #17372d;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    #status {
      margin: 20px 0;
      padding: 16px;
      background: #eef8f4;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #06c755;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>🧪 ทดสอบ Flex Message</h2>

    <p>
      ทดสอบ Share Target Picker
    </p>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <button
      id="shareButton"
      disabled
    >
      📤 ทดสอบแชร์ Flex
    </button>

  </div>


<script>

const LIFF_ID =
  '2011675892-0Bfvc8vq';

const statusBox =
  document.getElementById(
    'status'
  );

const shareButton =
  document.getElementById(
    'shareButton'
  );


function setStatus(text) {

  statusBox.textContent =
    text;

}


/*
 * Flex แบบง่ายที่สุด
 * ไม่มีข้อมูลผู้ป่วย
 * ไม่มี URL รายงาน
 * ไม่มีปุ่มแชร์ซ้อน
 */
const testFlex = {

  type: 'flex',

  altText:
    'ทดสอบระบบแชร์เคสสอบสวนโรค',

  contents: {

    type: 'bubble',

    body: {

      type: 'box',

      layout: 'vertical',

      contents: [

        {
          type: 'text',
          text: 'ทดสอบระบบแชร์เคส',
          weight: 'bold',
          size: 'xl'
        },

        {
          type: 'text',
          text: 'โรงพยาบาลท่าตูม',
          margin: 'md',
          size: 'md'
        },

        {
          type: 'text',
          text: 'Flex Message ทดสอบ',
          margin: 'md',
          size: 'sm',
          color: '#666666'
        }

      ]

    }

  }

};


async function initialize() {

  try {

    setStatus(
      'กำลังเชื่อมต่อ LINE...'
    );


    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      setStatus(
        'กำลังเข้าสู่ระบบ LINE...'
      );

      liff.login();

      return;

    }


    if (
      !liff.isApiAvailable(
        'shareTargetPicker'
      )
    ) {

      throw new Error(
        'อุปกรณ์นี้ไม่รองรับ Share Target Picker'
      );

    }


    setStatus(
      '✅ พร้อมทดสอบ Flex Message'
    );


    shareButton.disabled =
      false;


  } catch (error) {

    console.error(error);

    setStatus(
      '❌ ' +
      (
        error.message ||
        String(error)
      )
    );

  }

}


async function shareTestFlex() {

  shareButton.disabled =
    true;

  setStatus(
    'กำลังเปิดรายชื่อเพื่อน / กลุ่ม...'
  );


  try {

    const result =
      await liff.shareTargetPicker(
        [
          testFlex
        ],
        {
          isMultiple: true
        }
      );


    if (result) {

      setStatus(
        '✅ ส่ง Flex Message สำเร็จ'
      );

    } else {

      setStatus(
        'ℹ️ ยกเลิกการแชร์'
      );

    }


  } catch (error) {

    console.error(error);

    setStatus(
      '❌ แชร์ Flex ไม่สำเร็จ\n\n' +
      (
        error.message ||
        String(error)
      )
    );

  } finally {

    shareButton.disabled =
      false;

  }

}


shareButton.addEventListener(
  'click',
  shareTestFlex
);


initialize();

</script>

</body>
</html>
