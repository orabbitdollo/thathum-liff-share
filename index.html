<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>แชร์เคสสอบสวนโรค | โรงพยาบาลท่าตูม</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f8f5;
      color: #17372d;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    .sub {
      margin-bottom: 20px;
    }

    #status {
      margin: 20px 0;
      padding: 16px;
      background: #eef8f4;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      background: #06c755;
      color: #ffffff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .small {
      margin-top: 16px;
      font-size: 13px;
      color: #70847b;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>📤 แชร์เคสสอบสวนโรค</h2>

  <div class="sub">
    ระบบสอบสวนโรค โรงพยาบาลท่าตูม
  </div>

  <div id="status">
    กำลังเชื่อมต่อ LINE...
  </div>

  <button
    id="shareButton"
    type="button"
    disabled
  >
    📤 แชร์เคส
  </button>

  <div class="small">
    เลือกเพื่อนหรือกลุ่ม LINE ที่ต้องการส่งต่อ
  </div>

</div>


<script>

/* ======================================================
   CONFIG
====================================================== */

const LIFF_ID =
  '2011675892-0Bfvc8vq';

const API_URL =
  'https://script.google.com/macros/s/AKfycbxmKEqLCVqj7BHSwSOpunVlKf6o-B9pWTctYsNhwv2-ds8_XDSCRy2FwHxzbcrIyYph/exec';


/* ======================================================
   VARIABLES
====================================================== */

const statusBox =
  document.getElementById(
    'status'
  );

const shareButton =
  document.getElementById(
    'shareButton'
  );

let caseToken = '';

let flexMessage = null;


/* ======================================================
   STATUS
====================================================== */

function setStatus(message) {

  statusBox.textContent =
    message;

}


/* ======================================================
   TOKEN
====================================================== */

function isValidToken(token) {

  return /^[A-Fa-f0-9]{64}$/.test(
    String(token || '').trim()
  );

}


function saveToken(token) {

  if (!isValidToken(token)) {
    return;
  }

  try {

    sessionStorage.setItem(
      'THATUM_CASE_TOKEN',
      token
    );

  } catch (_) {}

}


function getCaseToken() {

  let token = '';

  /*
   * 1. อ่าน ?k= จาก URL
   */
  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    token =
      String(
        params.get('k') || ''
      ).trim();

  } catch (_) {}


  if (isValidToken(token)) {

    saveToken(token);

    return token;

  }


  /*
   * 2. รองรับ liff.state
   */
  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    let state =
      String(
        params.get('liff.state') || ''
      ).trim();


    if (state) {

      try {

        state =
          decodeURIComponent(state);

      } catch (_) {}


      const questionIndex =
        state.indexOf('?');


      if (questionIndex >= 0) {

        const stateParams =
          new URLSearchParams(
            state.substring(
              questionIndex + 1
            )
          );


        token =
          String(
            stateParams.get('k') || ''
          ).trim();


        if (isValidToken(token)) {

          saveToken(token);

          return token;

        }

      }

    }

  } catch (_) {}


  /*
   * 3. อ่านจาก sessionStorage
   */
  try {

    token =
      String(
        sessionStorage.getItem(
          'THATUM_CASE_TOKEN'
        ) || ''
      ).trim();

  } catch (_) {

    token = '';

  }


  if (isValidToken(token)) {

    return token;

  }


  return '';

}


/* ======================================================
   JSONP
====================================================== */

function loadCaseFromApi(token) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'thatumShare_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          'script'
        );


      let completed =
        false;


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'หมดเวลารอข้อมูลจากระบบ'
              )
            );

          },
          30000
        );


      function cleanup() {

        if (completed) {
          return;
        }

        completed =
          true;

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callbackName
          ];

        } catch (_) {

          window[
            callbackName
          ] = undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      window[
        callbackName
      ] =
        function(result) {

          if (completed) {
            return;
          }


          cleanup();


          resolve(
            result
          );

        };


      script.onerror =
        function() {

          if (completed) {
            return;
          }


          cleanup();


          reject(
            new Error(
              'ไม่สามารถเชื่อมต่อระบบข้อมูลเคสได้'
            )
          );

        };


      /*
       * ป้องกัน cache
       */
      const cacheBuster =
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      script.src =
        API_URL +
        '?action=sharePayload' +
        '&k=' +
        encodeURIComponent(
          token
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        ) +
        '&_=' +
        encodeURIComponent(
          cacheBuster
        );


      document.head.appendChild(
        script
      );

    }
  );

}


/* ======================================================
   LOAD WITH RETRY
====================================================== */

async function loadCase(token) {

  let lastError = null;


  for (
    let attempt = 1;
    attempt <= 2;
    attempt++
  ) {

    try {

      setStatus(
        'กำลังเตรียมข้อมูลเคส...'
      );


      const result =
        await loadCaseFromApi(
          token
        );


      return result;


    } catch (error) {

      lastError =
        error;


      if (attempt < 2) {

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1000
            );

          }
        );

      }

    }

  }


  throw lastError ||
    new Error(
      'ไม่สามารถโหลดข้อมูลเคสได้'
    );

}


/* ======================================================
   INITIALIZE
====================================================== */

async function initialize() {

  try {

    setStatus(
      'กำลังเชื่อมต่อ LINE...'
    );


    /*
     * เริ่ม LIFF
     */
    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * อ่าน token
     */
    caseToken =
      getCaseToken();


    /*
     * Login ถ้าจำเป็น
     */
    if (!liff.isLoggedIn()) {

      if (caseToken) {

        saveToken(
          caseToken
        );

      }


      setStatus(
        'กำลังเข้าสู่ระบบ LINE...'
      );


      liff.login();

      return;

    }


    /*
     * ตรวจ Share Target Picker
     */
    if (
      !liff.isApiAvailable(
        'shareTargetPicker'
      )
    ) {

      throw new Error(
        'อุปกรณ์นี้ไม่รองรับการแชร์ผ่าน LINE'
      );

    }


    /*
     * อ่าน token อีกครั้ง
     */
    if (!caseToken) {

      caseToken =
        getCaseToken();

    }


    if (!caseToken) {

      throw new Error(
        'ไม่พบรหัสเคสจากลิงก์แชร์'
      );

    }


    /*
     * โหลด Flex เคสจริง
     */
    const result =
      await loadCase(
        caseToken
      );


    if (
      !result ||
      result.ok !== true
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'ไม่สามารถเตรียมข้อมูลเคสได้'
      );

    }


    if (
      !result.message ||
      result.message.type !== 'flex'
    ) {

      throw new Error(
        'ข้อมูล Flex Message ไม่ถูกต้อง'
      );

    }


    flexMessage =
      result.message;


    /*
     * พร้อมแชร์
     */
    setStatus(
      '✅ พร้อมแชร์เคส'
    );


    shareButton.disabled =
      false;


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      '❌ ' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );


    shareButton.disabled =
      true;

  }

}


/* ======================================================
   SHARE REAL FLEX
====================================================== */

async function shareCase() {

  if (!flexMessage) {

    setStatus(
      '❌ ยังไม่มีข้อมูลเคสสำหรับแชร์'
    );

    return;

  }


  shareButton.disabled =
    true;


  setStatus(
    'กำลังเปิดรายชื่อเพื่อน / กลุ่ม...'
  );


  try {

    /*
     * ใช้วิธีเดียวกับ Flex ทดสอบ
     * ที่ผ่านบน iPhone แล้ว
     */
    const result =
      await liff.shareTargetPicker(
        [
          flexMessage
        ]
      );


    if (result) {

      setStatus(
        '✅ แชร์เคสสำเร็จ'
      );

    } else {

      setStatus(
        'ℹ️ ยกเลิกการแชร์'
      );

    }


  } catch (error) {

    console.error(
      error
    );


    const code =
      error &&
      error.code
        ? error.code
        : 'ไม่มี';


    const message =
      error &&
      error.message
        ? error.message
        : String(error);


    setStatus(
      '❌ ไม่สามารถแชร์เคสได้\n\n' +
      'Code: ' +
      code +
      '\n' +
      'Message: ' +
      message
    );


  } finally {

    shareButton.disabled =
      false;

  }

}


/* ======================================================
   BUTTON
====================================================== */

shareButton.addEventListener(
  'click',
  shareCase
);


/* ======================================================
   START
====================================================== */

initialize();

</script>

</body>
</html>
