<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ทดสอบ LIFF Mobile</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f8f5;
      color: #17372d;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    #status {
      margin: 18px 0;
      padding: 16px;
      background: #eef8f4;
      border-radius: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      background: #06c755;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.45;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #70847b;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>📱 ทดสอบแชร์บนมือถือ</h2>

  <div>
    ระบบสอบสวนโรค โรงพยาบาลท่าตูม
  </div>

  <div id="status">
    กำลังตรวจสอบ LINE...
  </div>

  <button
    id="shareButton"
    type="button"
    disabled
  >
    📤 ทดสอบแชร์ Flex
  </button>

  <div class="small">
    หน้านี้ใช้ตรวจสอบ LIFF บนมือถือ
  </div>

</div>


<script>

const LIFF_ID =
  '2011675892-0Bfvc8vq';

const statusBox =
  document.getElementById(
    'status'
  );

const shareButton =
  document.getElementById(
    'shareButton'
  );


function setStatus(text) {

  statusBox.textContent =
    text;

}


/* ==========================================
   FLEX ทดสอบ
========================================== */

const testFlex = {

  type: 'flex',

  altText:
    'ทดสอบระบบแชร์เคสสอบสวนโรค',

  contents: {

    type: 'bubble',

    body: {

      type: 'box',

      layout: 'vertical',

      contents: [

        {
          type: 'text',
          text: 'ทดสอบระบบแชร์เคส',
          weight: 'bold',
          size: 'xl'
        },

        {
          type: 'text',
          text: 'โรงพยาบาลท่าตูม',
          margin: 'md',
          size: 'md'
        },

        {
          type: 'text',
          text: 'ทดสอบจากโทรศัพท์มือถือ',
          margin: 'md',
          size: 'sm',
          color: '#666666'
        }

      ]

    }

  }

};


/* ==========================================
   INITIALIZE
========================================== */

async function initialize() {

  try {

    setStatus(
      'กำลังเริ่ม LIFF...'
    );


    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * ถ้ายังไม่ได้ Login
     */
    if (!liff.isLoggedIn()) {

      setStatus(
        'กำลังเข้าสู่ระบบ LINE...'
      );

      liff.login();

      return;

    }


    /*
     * ตรวจ Environment
     */

    const inClient =
      liff.isInClient();

    const loggedIn =
      liff.isLoggedIn();

    const shareAvailable =
      liff.isApiAvailable(
        'shareTargetPicker'
      );

    const os =
      liff.getOS();

    const version =
      liff.getVersion();


    /*
     * แสดงผลบนหน้าจอ
     */

    let info = '';

    info +=
      'LIFF พร้อมใช้งาน ✅\n\n';

    info +=
      'isInClient: ' +
      inClient +
      '\n';

    info +=
      'isLoggedIn: ' +
      loggedIn +
      '\n';

    info +=
      'Share Target Picker: ' +
      shareAvailable +
      '\n';

    info +=
      'OS: ' +
      os +
      '\n';

    info +=
      'LIFF SDK: ' +
      version;


    setStatus(info);


    /*
     * เปิดปุ่มเฉพาะเมื่อ
     * Share Target Picker ใช้ได้
     */

    if (shareAvailable) {

      shareButton.disabled =
        false;

    }


  } catch (error) {

    console.error(error);

    setStatus(
      '❌ LIFF ERROR\n\n' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }

}


/* ==========================================
   SHARE TEST
========================================== */

async function shareFlex() {

  shareButton.disabled =
    true;


  setStatus(
    'กำลังเรียก Share Target Picker...'
  );


  try {

    /*
     * สำคัญ:
     * เรียกโดยตรงจากการกดปุ่ม
     */

    const result =
      await liff.shareTargetPicker(
        [
          testFlex
        ]
      );


    /*
     * กลับมาจาก Target Picker
     */

    if (result) {

      setStatus(
        '✅ แชร์ Flex สำเร็จ'
      );

    } else {

      setStatus(
        'ℹ️ ยกเลิกการแชร์'
      );

    }


  } catch (error) {

    console.error(error);


    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    let code =
      error &&
      error.code
        ? error.code
        : 'ไม่มี';


    setStatus(
      '❌ Share Target Picker ERROR\n\n' +
      'Code: ' +
      code +
      '\n' +
      'Message: ' +
      message
    );

  } finally {

    shareButton.disabled =
      false;

  }

}


shareButton.addEventListener(
  'click',
  shareFlex
);


/* ==========================================
   START
========================================== */

initialize();

</script>

</body>
</html>
