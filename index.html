<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>แชร์เคสสอบสวนโรค | โรงพยาบาลท่าตูม</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f8f5;
      color: #17372d;
    }

    .card {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
    }

    h2 {
      margin-top: 0;
      color: #087f5b;
    }

    .sub {
      margin-bottom: 20px;
    }

    #status {
      margin: 20px 0;
      padding: 16px;
      background: #eef8f4;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      background: #06c755;
      color: #ffffff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .small {
      margin-top: 16px;
      font-size: 13px;
      color: #70847b;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>📤 แชร์เคสสอบสวนโรค</h2>

    <div class="sub">
      ระบบสอบสวนโรค โรงพยาบาลท่าตูม
    </div>

    <div id="status">
      กำลังเชื่อมต่อ LINE...
    </div>

    <button
      id="shareButton"
      type="button"
      disabled
    >
      📤 แชร์เคส
    </button>

    <div class="small">
      เลือกเพื่อนหรือกลุ่ม LINE ที่ต้องการส่งต่อ
    </div>

  </div>


  <script>

    /**
     * =============================================
     * CONFIG
     * =============================================
     */

    const LIFF_ID =
      '2011675892-0Bfvc8vq';


    const API_URL =
      'https://script.google.com/macros/s/AKfycbxmKEqLCVqj7BHSwSOpunVlKf6o-B9pWTctYsNhwv2-ds8_XDSCRy2FwHxzbcrIyYph/exec';


    /**
     * =============================================
     * ELEMENTS
     * =============================================
     */

    const statusBox =
      document.getElementById('status');

    const shareButton =
      document.getElementById('shareButton');


    let caseToken = '';

    let flexMessage = null;


    /**
     * =============================================
     * แสดงสถานะ
     * =============================================
     */

    function setStatus(message) {

      statusBox.textContent =
        message;

    }


    /**
     * =============================================
     * อ่าน CASE TOKEN
     *
     * รองรับ:
     * ?k=TOKEN
     *
     * และเก็บไว้ใน sessionStorage
     * =============================================
     */

    function getCaseToken() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      let token =
        String(
          params.get('k') || ''
        ).trim();


      /**
       * ถ้า URL มี token
       * ให้จำไว้ก่อน
       */
      if (
        /^[A-Fa-f0-9]{64}$/.test(token)
      ) {

        try {

          sessionStorage.setItem(
            'THATUM_CASE_TOKEN',
            token
          );

        } catch (_) {}

        return token;

      }


      /**
       * ถ้า URL ไม่มี token
       * ลองอ่านจาก sessionStorage
       */
      try {

        token =
          String(
            sessionStorage.getItem(
              'THATUM_CASE_TOKEN'
            ) || ''
          ).trim();

      } catch (_) {

        token = '';

      }


      if (
        /^[A-Fa-f0-9]{64}$/.test(token)
      ) {

        return token;

      }


      return '';

    }


    /**
     * =============================================
     * เรียก Apps Script ด้วย JSONP
     *
     * ไม่ใช้ fetch
     * เพื่อหลีกเลี่ยงปัญหา CORS
     * =============================================
     */

    function loadFlexMessage(token) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            'thatumCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() * 100000
            );


          let finished = false;


          /**
           * script element
           */
          const script =
            document.createElement(
              'script'
            );


          /**
           * timeout
           */
          const timer =
            setTimeout(
              function() {

                cleanup();

                reject(
                  new Error(
                    'หมดเวลารอข้อมูลจากระบบ'
                  )
                );

              },
              20000
            );


          /**
           * ล้าง callback และ script
           */
          function cleanup() {

            if (finished) {
              return;
            }

            finished = true;

            clearTimeout(timer);

            try {

              delete window[
                callbackName
              ];

            } catch (_) {

              window[
                callbackName
              ] = undefined;

            }

            if (
              script &&
              script.parentNode
            ) {

              script.parentNode
                .removeChild(script);

            }

          }


          /**
           * callback ที่ Apps Script
           * จะเรียกกลับมา
           */
          window[
            callbackName
          ] =
            function(result) {

              if (finished) {
                return;
              }

              cleanup();

              resolve(result);

            };


          /**
           * ถ้าโหลด API ไม่สำเร็จ
           */
          script.onerror =
            function() {

              if (finished) {
                return;
              }

              cleanup();

              reject(
                new Error(
                  'ไม่สามารถเชื่อมต่อระบบข้อมูลเคสได้'
                )
              );

            };


          /**
           * สร้าง URL API
           */
          script.src =
            API_URL +
            '?action=sharePayload' +
            '&k=' +
            encodeURIComponent(token) +
            '&callback=' +
            encodeURIComponent(
              callbackName
            );


          document.head
            .appendChild(script);

        }
      );

    }


    /**
     * =============================================
     * เริ่มระบบ
     * =============================================
     */

    async function initialize() {

      try {

        setStatus(
          'กำลังเชื่อมต่อ LINE...'
        );


        /**
         * LIFF INIT
         */
        await liff.init({
          liffId: LIFF_ID
        });


        /**
         * Login
         */
        if (!liff.isLoggedIn()) {

          setStatus(
            'กำลังเข้าสู่ระบบ LINE...'
          );

          liff.login();

          return;

        }


        /**
         * ตรวจ Share Target Picker
         */
        if (
          !liff.isApiAvailable(
            'shareTargetPicker'
          )
        ) {

          throw new Error(
            'อุปกรณ์นี้ไม่รองรับ Share Target Picker'
          );

        }


        /**
         * สำคัญ:
         * อ่าน token หลัง liff.init()
         */
        caseToken =
          getCaseToken();


        if (!caseToken) {

          throw new Error(
            'ไม่พบรหัสเคสจากลิงก์แชร์'
          );

        }


        setStatus(
          'กำลังเตรียมข้อมูลเคส...'
        );


        /**
         * ขอ Flex จาก Apps Script
         */
        const result =
          await loadFlexMessage(
            caseToken
          );


        if (
          !result ||
          result.ok !== true
        ) {

          throw new Error(
            result &&
            result.error
              ? result.error
              : 'ไม่สามารถเตรียมข้อมูลเคสได้'
          );

        }


        if (
          !result.message ||
          result.message.type !== 'flex'
        ) {

          throw new Error(
            'ข้อมูล Flex Message ไม่ถูกต้อง'
          );

        }


        flexMessage =
          result.message;


        /**
         * พร้อมแชร์
         */
        setStatus(
          '✅ พร้อมแชร์เคส'
        );

        shareButton.disabled =
          false;


      } catch (error) {

        console.error(error);

        setStatus(
          '❌ ' +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );

        shareButton.disabled =
          true;

      }

    }


    /**
     * =============================================
     * SHARE
     * =============================================
     */

    async function shareCase() {

      if (!flexMessage) {

        setStatus(
          '❌ ยังไม่มีข้อมูลเคสสำหรับแชร์'
        );

        return;

      }


      shareButton.disabled =
        true;


      setStatus(
        'กำลังเปิดรายชื่อเพื่อน / กลุ่ม...'
      );


      try {

        const result =
          await liff.shareTargetPicker(
            [
              flexMessage
            ],
            {
              isMultiple: true
            }
          );


        /**
         * ผู้ใช้ส่งสำเร็จ
         */
        if (result) {

          setStatus(
            '✅ แชร์เคสสำเร็จ'
          );

        } else {

          /**
           * ผู้ใช้กด X / ยกเลิก
           */
          setStatus(
            'ℹ️ ยกเลิกการแชร์'
          );

        }


      } catch (error) {

        console.error(error);

        setStatus(
          '❌ ไม่สามารถแชร์เคสได้\n\n' +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );

      } finally {

        shareButton.disabled =
          false;

      }

    }


    /**
     * ปุ่มแชร์
     */
    shareButton.addEventListener(
      'click',
      shareCase
    );


    /**
     * เริ่มระบบ
     */
    initialize();

  </script>

</body>
</html>
